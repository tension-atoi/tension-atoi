<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">tension-atoi profile banner</title>
  <desc id="desc">A dark interface-inspired banner for tension-atoi, connecting media systems, Linux desktops, electromechanics, and local-first AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081014"/>
      <stop offset="0.42" stop-color="#142022"/>
      <stop offset="0.72" stop-color="#221927"/>
      <stop offset="1" stop-color="#241A11"/>
    </linearGradient>
    <linearGradient id="trace" x1="108" y1="340" x2="1074" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55D6BE"/>
      <stop offset="0.32" stop-color="#A6E22E"/>
      <stop offset="0.58" stop-color="#F2C14E"/>
      <stop offset="0.82" stop-color="#F78154"/>
      <stop offset="1" stop-color="#B48EED"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#FFFFFF" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1200" height="460" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="34" fill="url(#grid)"/>
  <path d="M92 345 C216 238 318 327 454 212 C565 118 680 192 792 140 C899 90 982 92 1104 54" stroke="url(#trace)" stroke-width="5" stroke-linecap="round"/>
  <path d="M96 380 C244 312 348 374 512 282 C666 196 768 236 914 164 C994 124 1042 128 1110 124" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" stroke-linecap="round"/>
  <path d="M126 278 C236 235 298 256 410 180 C548 88 658 120 770 92 C858 70 942 62 1030 34" stroke="#55D6BE" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="68" y="70" width="616" height="272" rx="24" fill="#0C1518" fill-opacity="0.78" stroke="#D7FFF1" stroke-opacity="0.22"/>
    <rect x="88" y="92" width="98" height="10" rx="5" fill="#55D6BE"/>
    <rect x="202" y="92" width="52" height="10" rx="5" fill="#F2C14E"/>
    <rect x="270" y="92" width="38" height="10" rx="5" fill="#F78154"/>
    <text x="90" y="157" fill="#F7FBF7" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="56" font-weight="850" letter-spacing="0">tension-atoi</text>
    <text x="92" y="206" fill="#BFE9DD" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">local-first systems, interaction, automation</text>
    <text x="92" y="248" fill="#E6EEE9" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">self-taught, agent-assisted, learning in public</text>
    <text x="92" y="278" fill="#E6EEE9" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">communication/media background, now electromechanics</text>
  </g>

  <g filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="742" y="88" width="384" height="284" rx="24" fill="#11171D" fill-opacity="0.72" stroke="#FFE3A3" stroke-opacity="0.24"/>
    <text x="776" y="138" fill="#F7FBF7" font-size="18" font-weight="800">current vector</text>
    <rect x="776" y="168" width="288" height="38" rx="19" fill="#55D6BE" fill-opacity="0.13" stroke="#55D6BE" stroke-opacity="0.35"/>
    <text x="800" y="193" fill="#D7FFF1" font-size="15" font-weight="750">Linux desktop ownership</text>
    <rect x="776" y="222" width="288" height="38" rx="19" fill="#F2C14E" fill-opacity="0.13" stroke="#F2C14E" stroke-opacity="0.35"/>
    <text x="800" y="247" fill="#FFE3A3" font-size="15" font-weight="750">multimodal local context</text>
    <rect x="776" y="276" width="288" height="38" rx="19" fill="#F78154" fill-opacity="0.13" stroke="#F78154" stroke-opacity="0.35"/>
    <text x="800" y="301" fill="#FFD0C2" font-size="15" font-weight="750">automation with rollback</text>
  </g>
</svg>
