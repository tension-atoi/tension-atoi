<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Learning loop diagram</title>
  <desc id="desc">A five stage learning loop from media systems to Linux desktop, electromechanics, local AI, and user-owned automation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071013"/>
      <stop offset="1" stop-color="#20161D"/>
    </linearGradient>
    <linearGradient id="line" x1="98" y1="160" x2="1100" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55D6BE"/>
      <stop offset="0.25" stop-color="#A6E22E"/>
      <stop offset="0.5" stop-color="#F2C14E"/>
      <stop offset="0.75" stop-color="#F78154"/>
      <stop offset="1" stop-color="#B48EED"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <path d="M118 160H1082" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g>
      <circle cx="164" cy="160" r="34" fill="#55D6BE" fill-opacity="0.16" stroke="#55D6BE"/>
      <text x="164" y="167" text-anchor="middle" fill="#D7FFF1" font-size="20" font-weight="800">1</text>
      <text x="164" y="222" text-anchor="middle" fill="#F7FBF7" font-size="17" font-weight="800">Media systems</text>
      <text x="164" y="247" text-anchor="middle" fill="#B8CBC5" font-size="13">games, AI, platforms</text>
    </g>
    <g>
      <circle cx="386" cy="160" r="34" fill="#A6E22E" fill-opacity="0.15" stroke="#A6E22E"/>
      <text x="386" y="167" text-anchor="middle" fill="#DFFFA3" font-size="20" font-weight="800">2</text>
      <text x="386" y="222" text-anchor="middle" fill="#F7FBF7" font-size="17" font-weight="800">Linux desktop</text>
      <text x="386" y="247" text-anchor="middle" fill="#B8CBC5" font-size="13">KDE, Hyprland, shell</text>
    </g>
    <g>
      <circle cx="608" cy="160" r="34" fill="#F2C14E" fill-opacity="0.16" stroke="#F2C14E"/>
      <text x="608" y="167" text-anchor="middle" fill="#FFE3A3" font-size="20" font-weight="800">3</text>
      <text x="608" y="222" text-anchor="middle" fill="#F7FBF7" font-size="17" font-weight="800">Electromechanics</text>
      <text x="608" y="247" text-anchor="middle" fill="#B8CBC5" font-size="13">automated systems</text>
    </g>
    <g>
      <circle cx="830" cy="160" r="34" fill="#F78154" fill-opacity="0.16" stroke="#F78154"/>
      <text x="830" y="167" text-anchor="middle" fill="#FFD0C2" font-size="20" font-weight="800">4</text>
      <text x="830" y="222" text-anchor="middle" fill="#F7FBF7" font-size="17" font-weight="800">Local AI</text>
      <text x="830" y="247" text-anchor="middle" fill="#B8CBC5" font-size="13">context stays inspectable</text>
    </g>
    <g>
      <circle cx="1052" cy="160" r="34" fill="#B48EED" fill-opacity="0.16" stroke="#B48EED"/>
      <text x="1052" y="167" text-anchor="middle" fill="#E7D9FF" font-size="20" font-weight="800">5</text>
      <text x="1052" y="222" text-anchor="middle" fill="#F7FBF7" font-size="17" font-weight="800">User ownership</text>
      <text x="1052" y="247" text-anchor="middle" fill="#B8CBC5" font-size="13">visible, reversible tools</text>
    </g>
  </g>
</svg>
